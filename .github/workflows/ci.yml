name: CI

# Puertas de la web en cada push y PR: formato/lint, typecheck y la suite de
# tests de lógica. Ver docs/agents/verification.md y docs/agents/testing.md.
# La app móvil (mobile/) no entra aquí — tiene su propio toolchain.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: bun test

      - name: Drift check (archivos compartidos web ↔ móvil)
        if: ${{ !cancelled() }}
        run: bash scripts/check-shared-drift.sh
