name: CI

# Puertas de la web en cada push y PR: formato/lint, typecheck, la suite de
# tests de lógica (también en dos zonas horarias, porque parte del código de
# fechas depende de la hora local), los tests de componentes, el build de producción y que nada de
# servidor acabe en el bundle del navegador. Ver docs/agents/verification.md y
# docs/agents/testing.md. La app móvil (mobile/) tiene su propio job, `mobile`,
# con su propio toolchain (npm, no Bun: Metro no corre sobre Bun). El job `db`
# levanta un Supabase local y pasa los tests de la base de datos, y el job
# `e2e` recorre la app en un navegador contra otro igual.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA (una etiqueta se puede mover); la versión va en
      # el comentario. Para actualizar: gh api repos/<repo>/git/ref/tags/<tag>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Una sola fuente para la versión de Bun (también la lee package.json).
          bun-version-file: .bun-version

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # Corta en high/critical desde que el informe quedó limpio (ticket 41 de la
      # auditoría). Es la única alarma de las dependencias transitivas de la
      # web: GitHub no lee bun.lock, así que Dependabot no las ve.
      - name: Avisos de seguridad (bun audit)
        if: ${{ !cancelled() }}
        run: bun audit --audit-level=high

      - name: Lint (ESLint + Prettier)
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Typecheck (tests)
        if: ${{ !cancelled() }}
        run: bun run typecheck:test

      - name: Tests
        if: ${{ !cancelled() }}
        run: bun test

      # Componentes sobre jsdom (Vitest + Testing Library, `*.vitest.tsx`).
      - name: Tests de componentes
        if: ${{ !cancelled() }}
        run: bun run test:ui

      - name: Tests (Europe/Madrid)
        if: ${{ !cancelled() }}
        run: bun test
        env:
          TZ: Europe/Madrid

      - name: Tests (America/Mexico_City)
        if: ${{ !cancelled() }}
        continue-on-error: true # informativo hasta que se confirme que pasa
        run: bun test
        env:
          TZ: America/Mexico_City

      - name: Cobertura (informativa)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun test --coverage --coverage-reporter=text | tail -n 60

      - name: Drift check (archivos compartidos web ↔ móvil)
        if: ${{ !cancelled() }}
        run: bash scripts/check-shared-drift.sh

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Marcadores de servidor en el bundle de cliente
        if: ${{ !cancelled() }}
        run: bash scripts/check-client-bundle.sh

  # Puertas del móvil (ticket 27 de la auditoría): typecheck, ESLint (config de
  # Expo), Prettier y npm audit. Sin build nativo: eso necesita macOS y Xcode.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # `npm ci` respeta el legacy-peer-deps de mobile/.npmrc (ver su comentario).
      - name: Instalar dependencias
        run: npm ci

      # Sigue informativo (ticket 41): quedan dos avisos altos sin versión
      # corregida publicada, braces y node-forge. Cuando la tengan, se quita el
      # continue-on-error, como en la web.
      - name: Avisos de seguridad (npm audit)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: npx eslint .

      - name: Formato (Prettier)
        if: ${{ !cancelled() }}
        run: npx prettier --check .

  # Base de datos (ticket 25 de la auditoría): `supabase start` aplica todas las
  # migraciones a una base vacía, `supabase test db` pasa los tests de pgTAP de
  # supabase/tests/ (RLS y funciones) y los tipos versionados tienen que ser los
  # que dejan esas migraciones. No toca producción ni necesita secretos.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # La misma CLI que en local (`supabase --version`).
          version: 2.119.0

      # Solo la base de datos y lo que hace falta para generar los tipos y
      # entrar con un usuario: sin Studio, imágenes, correo, funciones ni logs.
      - name: Supabase local (migraciones desde cero)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      - name: Tests de la base de datos (pgTAP)
        run: supabase test db

      # El seed sirve para entrar de verdad: GoTrue acepta la contraseña y
      # PostgREST devuelve, con esa sesión, el plan del mes y su casa.
      - name: La persona del seed entra y lee su plan
        if: ${{ !cancelled() }}
        run: bash scripts/check-seed-login.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() }}
        with:
          bun-version-file: .bun-version

      - name: Instalar dependencias
        if: ${{ !cancelled() }}
        run: bun install --frozen-lockfile

      - name: Tipos generados = versionados
        if: ${{ !cancelled() }}
        run: bun run db:types:check

  # Smoke de punta a punta (ticket 25 de la auditoría): Playwright recorre Hoy,
  # Plan y Familia en el build de producción, contra un Supabase local con los
  # datos de supabase/seed.sql y un OpenRouter de mentira. Va después de `db`:
  # si las migraciones o el seed fallan, esto no tiene nada que probar. No toca
  # producción ni necesita secretos.
  e2e:
    needs: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Supabase local (migraciones y seed)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # El navegador pesa ~150 MB: se guarda por versión de Playwright.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Con caché solo instala las librerías del sistema que le faltan.
      - name: Navegador de Playwright
        run: bunx playwright install --with-deps chromium

      - name: Smoke E2E
        run: bash scripts/e2e.sh

      # La traza y la captura del fallo, para verlo sin repetirlo.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7
