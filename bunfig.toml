[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Bypasses the 24h guard for specific packages — confirm with the user before
# adding any. Empty for now.
minimumReleaseAgeExcludes = []

[test]
# All tests live under src/. Without this, `bun test` walks the whole repo to
# find them — including mobile/ios (Pods, builds: >1 GB) — which was ~70% of
# every local run, even when passing a single file.
root = "src"
# Sustituye supabaseAdmin por un doble en toda la suite: en local bun test carga
# el .env, y un test que tocara el cliente real hablaría con producción.
preload = ["./src/test/setup.ts"]
