    <g stroke-width="1.1" transform="translate(20, 16)" opacity="0.7">
      <path d="M52 18 C52 15 52.5 13 53 11"/>
      <path d="M48 22 C48 19 50 17.5 53 17.5 C56 17.5 58 19 58 22
               C58 23 58 25 58 27
               C57.5 32 56 36 55 38
               C54 39 53 39 52 38
               C51 36 49.5 32 49 27
               C49 25 48 23 48 22Z"/>
    </g>
