      <path d="M47 27 C48 34 49 45 46 58" stroke-width="1.2" opacity="0.5"/>
      <path d="M40 24 C40 32 40 48 40 61" stroke-width="1" opacity="0.35"/>
    </g>
    <!-- Small pepper -->
    <g stroke-width="1.3" transform="translate(14, 8)">
      <path d="M50 22 C50 19 51 16 51 14"/>
      <path d="M51 17 C54 14 58 15 56 19" stroke-width="1.1"/>
