  <!-- "Peppers" wordmark in Fraunces (warm editorial serif) -->
  <text x="105" y="53" font-family="'Fraunces', Georgia, serif"
        font-size="34" font-weight="600" fill="#3E3D39" letter-spacing="0.5">
    Peppers
